function porcentajes100(vals,total){ // truncar a 1 decimal + ajustar para que sumen 100 (mayor resto)
  if(total<=0)return vals.map(function(){return 0;});
  var f=10, crudos=vals.map(function(v){return v/total*100;});
  var trunc=crudos.map(function(x){return Math.floor(x*f)/f;});
  var falta=Math.round((100-trunc.reduce(function(a,b){return a+b;},0))*f);
  var idx=crudos.map(function(x,i){return i;}).sort(function(a,b){
    return ((crudos[b]*f)-Math.floor(crudos[b]*f))-((crudos[a]*f)-Math.floor(crudos[a]*f)); });
  var aj=trunc.slice();
  for(var k=0;k<falta;k++){ aj[idx[k%idx.length]]+=1/f; }
  return aj.map(function(x){return Math.round(x*10)/10;});
}

function espColor(v){
  if(v<=_espCalifData.riesgo_max)return '#c0392b';
  if(v<=_espCalifData.satisfactorio_max)return '#e0a020';

}

function svgAvance(r){ // ACUMULATIVA: solo periodos HASTA el elegido
  var _pe=_espPerEfectivo();
  var datos=r.avance.filter(function(x){
    if(x.periodo==='DIAG') return true;              // el diagnostico siempre va de primero
    if(x.periodo==='GRADO') return _pe==='GRADO';    // la barra final solo en Generales
    return (_pe==='DIAG') ? false : (_pe==='GRADO' ? true : (x.periodo<=_pe));
  });
  var W=420,H=240,pt=26,pb=40,pl=34,bw=64,gap=(datos.length>=5?34:54),x0=pl+14;
  // el lienzo CRECE segun cuantas barras haya (3 periodos, o 4 con el
  // diagnostico). Como el svg va a width:100%, se reescala solito.
  W=Math.max(W, x0+datos.length*(bw+gap)-gap+22);
  function y(v){ return pt+(H-pt-pb)*(1-(v-5)/5); }
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gbav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a5488"/><stop offset="1" stop-color="#1f2d4a"/></linearGradient><linearGradient id="gbgr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9b44a"/><stop offset="1" stop-color="#8d6a1d"/></linearGradient></defs>';
  [5,6,7,8,9,10].forEach(function(gv){ var yy=y(gv); s+='<line x1="'+pl+'" y1="'+yy.toFixed(0)+'" x2="'+(W-14)+'" y2="'+yy.toFixed(0)+'" stroke="#eef1f7"/><text x="'+(pl-6)+'" y="'+(yy+3).toFixed(0)+'" font-size="9" fill="#9aa5b8" text-anchor="end">'+gv+'</text>'; });
  var pts=[];
  datos.forEach(function(x,i){ var bx=x0+i*(bw+gap),by=y(x.promedio); if(x.periodo!=='GRADO')pts.push([bx+bw/2,by]);
    s+='<rect x="'+bx.toFixed(0)+'" y="'+by.toFixed(0)+'" width="'+bw+'" height="'+((H-pb)-by).toFixed(0)+'" rx="7" fill="url(#'+(x.periodo==='GRADO'?'gbgr':'gbav')+')"/>';
    s+='<text x="'+(bx+bw/2).toFixed(0)+'" y="'+(by-7).toFixed(0)+'" font-size="15" font-weight="800" fill="#1f2d4a" text-anchor="middle">'+x.promedio+'</text>';
    s+='<text x="'+(bx+bw/2).toFixed(0)+'" y="'+(H-pb+16).toFixed(0)+'" font-size="11" font-weight="700" fill="#8c4655" text-anchor="middle">'+(x.periodo==='DIAG'?'DIAG':(x.periodo==='GRADO'?'GRADO':'P'+x.periodo))+'</text>'; });
  if(pts.length>1){ var path='M'+pts.map(function(p){return p[0].toFixed(0)+' '+p[1].toFixed(0);}).join(' L');
    s+='<path d="'+path+'" fill="none" stroke="#8c4655" stroke-width="2.5" stroke-dasharray="4 3" opacity=".65"/>';
    pts.forEach(function(p){ s+='<circle cx="'+p[0].toFixed(0)+'" cy="'+p[1].toFixed(0)+'" r="4" fill="#8c4655"/>'; }); }
  return s+'</svg>';
}

function svgDona(r,p){
  var sm=r.semaforo[String(p)]; if(!sm)return '<div class="al-pick">Sin datos de P'+p+'</div>';
  var total=sm.riesgo+sm.satisf+sm.sobre,cx=84,cy=84,ra=66,rin=40,ang=-90;
  var s='<svg viewBox="0 0 168 168" width="168" height="168" xmlns="http://www.w3.org/2000/svg">';
  /* LA DONA TAMBIEN SABE SER UN SOLO COLOR (Ladrillo 113): Jose lo cazo en "3 C" del
     26-27 -- un nivel al 100% pedia un arco de 360 grados, y ese arco
     empieza y termina en el MISMO punto: el SVG, con inicio y fin
     identicos, no traza nada. Cuando un nivel es el total completo,
     se dibuja un anillo (circulo con solo el borde) en vez del arco:
     ese si se ve, sin importar el angulo. */
  [['#c0392b',sm.riesgo],['#e0a020',sm.satisf],['#1e8449',sm.sobre]].forEach(function(seg){
    var val=seg[1]; if(val===0)return;
    if(val===total){ s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((ra+rin)/2)+'" fill="none" stroke="'+seg[0]+'" stroke-width="'+(ra-rin)+'"/>'; return; }
    var sw=val/total*360,a0=ang*Math.PI/180,a1=(ang+sw)*Math.PI/180;
    var xo0=cx+ra*Math.cos(a0),yo0=cy+ra*Math.sin(a0),xo1=cx+ra*Math.cos(a1),yo1=cy+ra*Math.sin(a1);
    var xi0=cx+rin*Math.cos(a1),yi0=cy+rin*Math.sin(a1),xi1=cx+rin*Math.cos(a0),yi1=cy+rin*Math.sin(a0);
    var lg=sw>180?1:0;
    s+='<path d="M'+xo0.toFixed(1)+' '+yo0.toFixed(1)+' A'+ra+' '+ra+' 0 '+lg+' 1 '+xo1.toFixed(1)+' '+yo1.toFixed(1)+' L'+xi0.toFixed(1)+' '+yi0.toFixed(1)+' A'+rin+' '+rin+' 0 '+lg+' 0 '+xi1.toFixed(1)+' '+yi1.toFixed(1)+' Z" fill="'+seg[0]+'"/>';
    ang+=sw; });
  s+='<text x="'+cx+'" y="'+(cy-2)+'" font-size="24" font-weight="800" fill="#1f2d4a" text-anchor="middle">'+total+'</text><text x="'+cx+'" y="'+(cy+14)+'" font-size="9" fill="#9aa5b8" text-anchor="middle">alumnos</text>';
  return s+'</svg>';
}

function svgAlumnos(r,p){
  var act=r.alumnos.filter(function(a){ return !a.es_baja && a.periodos[String(p)].promedio!=='' && a.periodos[String(p)].promedio!=='- - -'; });

    s+='<rect x="'+pl+'" y="'+(y-5).toFixed(0)+'" width="'+bwmax+'" height="10" rx="5" fill="#f0ecef"/>';
    s+='<rect x="'+pl+'" y="'+(y-5).toFixed(0)+'" width="'+Math.max(0,bw).toFixed(0)+'" height="10" rx="5" fill="'+col+'"/>';
    s+='<text x="'+(pl+Math.max(0,bw)+6).toFixed(0)+'" y="'+(y+4).toFixed(0)+'" font-size="9" font-weight="700" fill="'+col+'">'+pr+'</text>'; });

function juezEnvio(txt,ctx){var o;try{o=JSON.parse(txt)}catch(e){return {ok:false,rechazos:['El archivo no se puede leer.'],avisos:[]}}
  var R=[],A=[];if(!o||!o.cuerpo||!o.huella)return {ok:false,rechazos:['No es un archivito de envío.'],avisos:[]};

  var base={},i;ctx.alumnos.forEach(function(a){base[a.id]=1});var env={};c.alumnos.forEach(function(a){env[a.curp]=a});
  var demas=Object.keys(env).filter(function(k){return !base[k]}),faltan=Object.keys(base).filter(function(k){return !env[k]});

  if(faltan.length)R.push('Le faltan '+faltan.length+' alumno(s) que la corona sí tiene.');
  if(c.actualizacion!==ctx.actualizacion)A.push('La página traía la actualización '+c.actualizacion+' y la corona va en la '+ctx.actualizacion+'.');

  syncLlama({op:'enviar',clave:SIGEA_WEB.k,periodo:String(p),envio:obj,cid:e.cid}).then(function(r){
    envB()[p]=0;

    else if(r&&r.error==='llave no valida'){e.motivo='llave';envGuarda();}
    else{e.err=String((r&&r.error)||'respuesta rara');envGuarda();envProgramar(30000);}
    envPinta(p);if(pend.length>1)envProgramar(200);})
  .catch(function(){envB()[p]=0;envPinta(p);envProgramar(20000);});}
function envBind(p){var el=$('#envEst');if(!el||el.dataset.p!==String(p))return;var e=envEstado(p),h='';

  else h='<p style="font-size:1.35em;margin:6px 0;color:#b07a14">⏳ <b>Aún no llega</b></p><p>Tu envío está guardado en este aparato, pero <b>todavía NO llega a la bodega del director</b> (no hay señal o falló). Se mandará solo en cuanto se pueda.</p><button class="btn verde" id="envRe" style="width:100%">Reintentar ahora</button><button class="btn gris" id="envWa" style="width:100%;margin-top:8px">Mandarlo por WhatsApp mejor</button><button class="btn gris" id="envCa" style="width:100%;margin-top:8px">Cancelar el envío y seguir capturando</button>';

/* ===== ACTUALIZACION AUTOMATICA (Ladrillo 414): la pagina se pone al dia con lo que el director publico ===== */
function webCuerpoAct(q){return {tipo:'actualizacion',pagina:PAGE_ID,actualizacion:q.actualizacion,alumnos:q.alumnos,estados:q.estados,datos:q.datos||{},reabrir:q.reabrir||[]};}
function webActualiza(q){

  var cu=webCuerpoAct(q),j=juezActualizacion(JSON.stringify({huella:huella(JSON.stringify(cu)),cuerpo:cu}));
  if(!j.ok)return false;

  aplicarActualizacion(c);if(q.blindado)D.blindado=q.blindado;if(fsImg(q.firma_dir))D.firma_dir=q.firma_dir;if(fsImg(q.sello_dir))D.sello_dir=q.sello_dir;if(q.director&&typeof q.director==='object')D.director=q.director;if(typeof q.lugar==='string')D.lugar=q.lugar;

  if(P.difs)h+='<li>✏️ El director corrigió <b>'+P.difs+'</b> dato(s) en lo cerrado: se queda lo del SIGEA.</li>';
  if(!P.altas.length&&!P.bajas.length&&!P.estados.length&&!P.difs)h+='<li>Solo se anotó el número de actualización.</li>';
  h+='</ul>'+(P.intactas?'<p style="color:#1e6b3a"><b>Lo que capturaste en periodos que siguen abiertos o enviados ('+P.intactas+' datos) no se tocó.</b></p>':'')+'<button class="btn" id="shX" style="width:100%">Entendido</button>';

var K='',B=SIGEA_BODEGA;
try{var h=(location.hash||'').replace(/^#/,'');
  if(h.indexOf('=')<0)K=decodeURIComponent(h);
  else h.split('&').forEach(function(x){var i=x.indexOf('='),n=x.slice(0,i),v=decodeURIComponent(x.slice(i+1));if(n==='k')K=v;if(n==='b'&&!SIGEA_BODEGA)B=v;});
}catch(e){}
function hh(s){var a=0x811c9dc5,b=0x1b873593;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=Math.imul(a^c,16777619);b=Math.imul(b^c,2246822519);}return (a>>>0).toString(36)+(b>>>0).toString(36);}
var CK='sigea_web_'+hh(K);
function leeCache(){try{return JSON.parse(localStorage.getItem(CK)).p||null;}catch(e){return null;}}
function guardaCache(p){try{localStorage.setItem(CK,JSON.stringify({p:p}));}catch(e){}}
function borraCache(){try{localStorage.removeItem(CK);}catch(e){}}
function arranca(p,aviso){
  window.SIGEA_WEB={k:K,b:B,paq:p};
  var js=JSON.stringify(p).replace(/<\//g,'<\\/').replace(new RegExp('['+String.fromCharCode(8232)+String.fromCharCode(8233)+']','g'),function(c){return c.charCodeAt(0)===8232?'\\u2028':'\\u2029';});
  P.remove();
  corre(TXT.replace(MARCA,function(){return js;}));
  if(aviso)setTimeout(function(){try{toast(aviso);}catch(e){}},400);}
function busca(){
  pinta('⏳','Buscando tu grupo…','Un momento.');
  if(!B){pinta('⚠️','Falta la dirección de la bodega','Esta página no está preparada. Avísale al director.');return;}
  fetch(B,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({op:'traer',clave:K})})
  .then(function(r){return r.json();})
  .then(function(r){
    if(r&&r.ok===true){
      if(!r.paquete){pinta('📭','Tu grupo todavía no está listo','El director aún no lo ha publicado. Intenta más tarde.',true);return;}
      guardaCache(r.paquete);arranca(r.paquete);return;}
    if(r&&r.error==='llave no valida'){borraCache();pinta('🔒','Esta llave ya no está activa','Pídele al director tu enlace nuevo.');return;}
    pinta('⚠️','No se pudo abrir',String((r&&r.error)||'respuesta rara').replace(/[<>&]/g,''),true);})
  .catch(function(){var c=leeCache();
    if(c)arranca(c,'📴 Sin señal: abrí la copia guardada en este aparato');
    else pinta('📴','Sin señal','Necesito internet la primera vez. Revisa tu conexión.',true);});}
if(!K){pinta('🔑','Falta tu llave','Abre esta página desde el enlace que te mandó el director.');return;}
busca();
})();
</script>
