<style>
:root{
  --noche:#091428; --navy:#12234a; --vino:#6d2440; --oro:#e2bb62; --oro2:#a9832f;
  --azur:#1f7ae0; --azur2:#0c4aa6; --nar:#ef8a1d; --nar2:#c4560a; --esc:#e0264d; --esc2:#9c1236;
  --ver:#1fa673; --ver2:#0d6b4a; --mor:#8656e0; --mor2:#4b2a9c; --tea:#17a0ad; --tea2:#0a6470;
  --texto:#f4f6fb; --suave:#b9c3da; --cristal:rgba(255,255,255,.08); --borde:rgba(255,255,255,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  min-height:100vh;color:var(--texto);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(900px 500px at 100% -10%, rgba(109,36,64,.75), transparent 60%),
    radial-gradient(700px 500px at -10% 30%, rgba(31,122,224,.25), transparent 60%),
    linear-gradient(180deg,#0a1630 0%,#091428 55%,#0b1a36 100%);
  background-attachment:fixed;
}
.estrellas{position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1.2px 1.2px at 20% 15%,#fff,transparent),radial-gradient(1px 1px at 70% 8%,#fff,transparent),
  radial-gradient(1.4px 1.4px at 85% 40%,#e2bb62,transparent),radial-gradient(1px 1px at 10% 60%,#fff,transparent),
  radial-gradient(1.2px 1.2px at 55% 75%,#e2bb62,transparent),radial-gradient(1px 1px at 92% 88%,#fff,transparent);}
.app{position:relative;max-width:460px;margin:0 auto;padding:0 16px 40px}
.cinta{margin:0 -16px;padding:7px 16px;text-align:center;font-size:.72rem;letter-spacing:.04em;color:#2a1a00;
  background:repeating-linear-gradient(45deg,#e2bb62,#e2bb62 14px,#d6a93f 14px,#d6a93f 28px);font-weight:800}
/* --- sello y corona --- */
.sello{text-align:center;padding:26px 0 8px}
.corona{position:relative;display:inline-block;font-size:3.1rem;line-height:1;filter:drop-shadow(0 4px 14px rgba(226,187,98,.55))}
.corona::after{content:"";position:absolute;inset:-6px;border-radius:50%;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);
  background-size:250% 100%;mix-blend-mode:overlay;animation:destello 4.5s ease-in-out infinite}
@keyframes destello{0%,55%{background-position:140% 0}100%{background-position:-60% 0}}
.chispa{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,236,170,.9);opacity:0;animation:chispa 4.5s ease-in-out infinite}
.chispa.a{top:2px;left:-6px;animation-delay:.4s}.chispa.b{top:-4px;right:2px;animation-delay:1.7s}.chispa.c{top:22px;right:-10px;animation-delay:2.9s}
@keyframes chispa{0%,100%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1)}30%{opacity:0;transform:scale(.4)}}
.sello h1{margin:10px 0 2px;font-size:1.28rem;letter-spacing:.01em}
.sello p{margin:0;color:var(--suave);font-size:.82rem}
/* --- bienvenida --- */
.cristal{background:var(--cristal);border:1px solid var(--borde);border-radius:22px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 14px 40px rgba(0,0,0,.28)}
.bien{padding:18px 18px 12px;margin-top:14px}
.bien .hola{font-size:1.28rem;font-weight:800;margin:0}
.bien .cuando{color:var(--suave);font-size:.84rem;margin:4px 0 12px}
.dias{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.dias .barra{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.dias .barra i{display:block;height:100%;width:28%;border-radius:99px;background:linear-gradient(90deg,var(--oro2),var(--oro))}
.dias span{font-size:.76rem;color:var(--suave);white-space:nowrap}
.rev h2{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--oro);margin:0 0 8px}
.ren{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:inherit;font:inherit;
  background:rgba(255,255,255,.06);border:1px solid var(--borde);border-radius:14px;padding:11px 12px;margin:0 0 8px;cursor:pointer;
  transition:transform .12s,background .12s}
.ren:active{transform:scale(.98);background:rgba(255,255,255,.12)}
.ren .pt{flex:0 0 12px;height:12px;border-radius:50%}
.ren b{display:block;font-size:.92rem}.ren small{color:var(--suave);font-size:.78rem}
.ren .fl{margin-left:auto;color:var(--suave);font-size:1.2rem}
/* --- cofres --- */
.cofres{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.cofre{position:relative;overflow:hidden;border:0;border-radius:24px;padding:16px 15px 15px;text-align:left;color:#fff;font:inherit;cursor:pointer;
  min-height:128px;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 14px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -18px 30px rgba(0,0,0,.18);
  transition:transform .14s,box-shadow .14s}
.cofre:active{transform:translateY(2px) scale(.985);box-shadow:0 6px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.cofre::before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.cofre::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent)}
.cofre .ico{position:relative;z-index:1;font-size:2.1rem;line-height:1;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3))}
.cofre h3{position:relative;z-index:1;margin:10px 0 6px;font-size:1.05rem;line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.cofre .et{position:relative;z-index:1;align-self:flex-start;font-size:.74rem;font-weight:800;padding:4px 10px;border-radius:99px;
  background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.28)}
.cofre.grande{grid-column:1 / -1;min-height:150px;flex-direction:row;align-items:center;gap:14px;justify-content:flex-start}
.cofre.grande .ico{font-size:3rem}.cofre.grande h3{font-size:1.3rem;margin:0 0 8px}
.cofre.grande>div{position:relative;z-index:1}
.c-azur{background:linear-gradient(145deg,#3b95ff,var(--azur) 45%,var(--azur2))}
.c-nar{background:linear-gradient(145deg,#ffab4a,var(--nar) 45%,var(--nar2))}
.c-esc{background:linear-gradient(145deg,#ff5577,var(--esc) 45%,var(--esc2))}
.c-ver{background:linear-gradient(145deg,#3fd197,var(--ver) 45%,var(--ver2))}
.c-mor{background:linear-gradient(145deg,#a98aff,var(--mor) 45%,var(--mor2))}
.c-tea{background:linear-gradient(145deg,#45d0dc,var(--tea) 45%,var(--tea2))}
.c-fus{background:linear-gradient(145deg,#ff6ec7,#e0309a 45%,#9c1068)}
.c-oro{background:linear-gradient(145deg,#f3d388,var(--oro) 45%,var(--oro2));color:#2b1c00}
.c-lim{background:linear-gradient(145deg,#c6ee5a,#8cc21f 45%,#557a0c);color:#1c2a00}
.c-oro h3{text-shadow:none}.c-oro .et{background:rgba(255,255,255,.4);border-color:rgba(0,0,0,.2);color:#2b1c00}
.sec{margin:22px 4px 4px;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--suave)}
/* --- pie --- */
.pie{text-align:center;margin-top:30px;color:var(--suave);font-size:.8rem}
.pie svg{display:block;margin:0 auto 4px;animation:paso 6s ease-in-out infinite}
@keyframes paso{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.pie em{font-style:normal;color:var(--oro)}
/* --- hoja inferior --- */
.fondo{position:fixed;inset:0;background:rgba(3,8,20,.62);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.fondo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(100%,460px);max-height:92vh;overflow:auto;z-index:21;
  background:linear-gradient(180deg,#152a57,#0d1c3d);border:1px solid var(--borde);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px 26px;
  transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.hoja.on{transform:translate(-50%,0)}
.hoja.cen{bottom:auto;top:50%;transform:translate(-50%,-44%);opacity:0;pointer-events:none;border-bottom:1px solid var(--borde);border-radius:26px;padding-bottom:22px;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s}
.hoja.cen.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.asa{width:46px;height:5px;border-radius:9px;background:rgba(255,255,255,.28);margin:0 auto 12px}
.hoja h2{margin:0 0 4px;font-size:1.2rem}.hoja .sub{color:var(--suave);font-size:.85rem;margin:0 0 14px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:inherit;font-weight:800;font-size:1rem;color:#2b1c00;cursor:pointer;
  background:linear-gradient(145deg,#f3d388,var(--oro));box-shadow:0 8px 20px rgba(226,187,98,.3)}
.btn[disabled]{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn.sec2{background:rgba(255,255,255,.1);color:var(--texto);box-shadow:none;margin-top:8px}

.nota{font-size:.78rem;color:var(--suave);margin:0 0 12px}
.estado{padding:26px 18px;margin-top:14px;text-align:center}
.estado .gr{font-size:2.6rem}.estado h2{margin:6px 0;font-size:1.15rem}.estado p{color:var(--suave);margin:0 0 14px;line-height:1.4;font-size:.9rem}
.estado .btn{max-width:260px;margin:0 auto}
.cofre.apagado{filter:saturate(.85)}
.cofre.apagado .et{background:rgba(0,0,0,.34)}
.cofre.link{text-decoration:none}
a.cofre{color:#fff}
.obra{text-align:center;padding:6px 0 4px}.obra .gr{font-size:2.4rem}
.obra svg{display:block;margin:6px auto 2px;animation:paso 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.corona::after,.chispa,.pie svg{animation:none}.chispa{opacity:0}.hoja{transition:none}}

/* --- bienvenida de la corona (Ladrillo 469) --- */
body{background:radial-gradient(700px 420px at 50% -8%,rgba(201,164,58,.16),transparent 62%),linear-gradient(180deg,#1a1119,#150f16 45%,#120d14)!important}
.estrellas{display:none}
.sello{display:none}
.bv{text-align:center;padding-top:6px}
.bv .escu{margin:18px 0 0;color:#8a7a96;font-size:.78rem;letter-spacing:.06em}
.bv .corona{font-size:3.4rem;margin-top:14px}
.bv h1{margin:14px 0 4px;font-size:1.6rem;color:#e8cd7a;font-weight:900;text-shadow:0 2px 12px rgba(201,164,58,.25);line-height:1.15}
.bv h1 span{font-size:1.3rem;margin-right:8px}
.bv .fecha{color:#b9a7c9;font-size:1rem;margin:0}.bv .ciclo{color:#7f6e92;margin:3px 0 0;font-size:.9rem}
.bv .nom{color:#8a7a96;font-size:.8rem;margin:8px 0 0}
.cuatro,.num{text-align:center}
.cic{margin:20px auto 0;max-width:520px}.cic-t{text-align:center;font-size:.82rem;color:#C9A227;text-transform:uppercase;letter-spacing:.14em;margin-bottom:8px}.cic-b{height:10px;border-radius:6px;background:rgba(255,255,255,.07);border:1px solid rgba(201,162,39,.2);overflow:hidden}.cic-b i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#8c6d24,#C9A227,#F4E4A6);box-shadow:0 0 12px rgba(201,162,39,.5);transition:width 1.1s ease}
.cuatro{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.num{background:#1c141d;border:1px solid #3a2c2a;border-radius:16px;padding:14px 4px 11px}
.num b{display:block;font-size:1.9rem;color:#f4e3a8;line-height:1}.num small{display:block;margin-top:6px;color:#b9a7c9;letter-spacing:.1em;font-size:.62rem}
.num.v{border-color:#4f9b83;background:linear-gradient(180deg,#1b2420,#171219)}.num.v b{color:#a9f0cf}
.atn{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;border:1px solid #b99635;border-radius:18px;padding:16px;font:inherit;color:#fff7de;font-weight:800;font-size:1.05rem;text-align:left;cursor:pointer;background:linear-gradient(100deg,#c4a03e,#a07c2a 55%,#7f6120);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.atn .p{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b8,#e0b83a 60%,#a47d1b);flex:0 0 22px}
.atn .n{margin-left:auto;background:rgba(255,255,255,.22);border-radius:99px;padding:3px 13px;font-size:.95rem}
.atn .f{opacity:.8;font-size:1.3rem}
.atn.bien-todo{background:linear-gradient(100deg,#2f7d63,#256a54 55%,#1d5443);border-color:#4f9b83}
.accesos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}
.acc{display:block;text-decoration:none;text-align:center;background:#1c141d;border:1px solid #3a2c2a;border-radius:16px;padding:14px 4px 11px;color:#f1e7f4;font:inherit;cursor:pointer}
.acc .i{display:block;font-size:1.9rem;line-height:1}.acc small{display:block;margin-top:8px;letter-spacing:.09em;font-weight:800;font-size:.66rem;text-transform:uppercase;color:#e1d3ea}
.acc:active{transform:scale(.97)}
.entrar{margin:26px auto 0;display:block;border:1px solid #8d6a1d;background:linear-gradient(180deg,#3a2a14,#2a1d10);color:#f7e7a8;font:inherit;font-weight:900;font-size:1.15rem;border-radius:16px;padding:15px 38px;cursor:pointer}
.it{display:flex;gap:12px;align-items:center;width:100%;text-align:left;color:inherit;font:inherit;text-decoration:none;background:rgba(255,255,255,.06);border:1px solid var(--borde);border-radius:14px;padding:12px;margin:0 0 9px;cursor:pointer}
.it .pt{flex:0 0 12px;height:12px;border-radius:50%}.it b{display:block;font-size:.95rem}.it small{color:var(--suave)}.it .fl{margin-left:auto;color:var(--suave);font-size:1.2rem}
.insta{display:block;width:100%;margin:18px 0 0;text-align:center;background:#1c141d;border:1px dashed #8d6a1d;border-radius:16px;padding:12px 10px;color:#f7e7a8;font:inherit;font-weight:800;font-size:.95rem;cursor:pointer}.insta small{display:block;margin-top:3px;font-weight:600;font-size:.74rem;color:#b9a97a}
.salir-b{display:block;margin:22px auto 0;background:none;border:0;color:#8a7a96;font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;padding:8px 14px}
.sala-tit{margin:34px 4px 0;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--suave);text-align:center}
/* --- PIZARRON DE AVISOS (Ladrillo 474) --- */
.volv{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:12px;border:1px solid rgba(191,230,255,.5);background:rgba(191,230,255,.14);color:#bfe6ff;font:inherit;font-weight:700;font-size:.88rem;cursor:pointer;white-space:nowrap}
.pz-top{display:flex;align-items:center;gap:10px;margin:16px 0 12px}
.pz-marco{padding:9px;border-radius:16px;background:linear-gradient(135deg,#a8743a,#7a4d22 45%,#98652f 70%,#6b4220);box-shadow:0 16px 34px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.3)}
.pz-pizarra{position:relative;border-radius:7px;padding:16px 12px 24px;min-height:360px;background:radial-gradient(500px 260px at 30% 0,rgba(255,255,255,.07),transparent 70%),linear-gradient(160deg,#21594a,#173f35 60%,#1b4a3d);box-shadow:inset 0 0 36px rgba(0,0,0,.55),inset 0 0 0 2px rgba(0,0,0,.25)}
.pz-tit{text-align:center;margin:0;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-weight:400;font-size:1.7rem;color:#f5f1e3;text-shadow:0 0 1px rgba(255,255,255,.6)}
.pz-sub{text-align:center;font-family:"Segoe Print","Bradley Hand",cursive;font-size:.85rem;color:#cfe3d6;opacity:.85;margin:2px 0 4px}
.pz-raya{height:2px;margin:8px auto 14px;width:62%;background:linear-gradient(90deg,transparent,rgba(245,241,227,.55),transparent)}
.pz-pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.pz-pill{font-size:.76rem;padding:3px 11px;border-radius:99px;border:1px dashed rgba(245,241,227,.5);color:#f5f1e3}
.pz-pill b{color:#ffd0d9}
.pz-lista{display:grid;gap:24px}
.pz-nota{position:relative;padding:20px 15px 13px;border-radius:3px;background:linear-gradient(180deg,#fdf6df,#f6ecc9);color:#35290f;box-shadow:0 6px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.7);transform:rotate(var(--g,0deg))}
.pz-nota.ya{opacity:.82;background:linear-gradient(180deg,#f3efdc,#e9e3c6)}
.pz-nota.nueva{box-shadow:0 8px 18px rgba(0,0,0,.45),0 0 0 2px rgba(224,38,77,.55)}
.pz-tach{position:absolute;top:-8px;left:50%;margin-left:-11px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8aa0,var(--esc) 45%,var(--esc2));box-shadow:0 3px 5px rgba(0,0,0,.45)}
.pz-nota.ya .pz-tach{background:radial-gradient(circle at 35% 30%,#7ee6b9,var(--ver) 45%,var(--ver2))}
.pz-cab{display:flex;justify-content:space-between;gap:8px;font-size:.72rem;color:#7a6a3c;margin-bottom:6px}
.pz-cab b{color:#6d2440}
.pz-h{margin:0 0 6px;font-size:1.02rem;line-height:1.25;color:#2b1f07}
.pz-p{margin:0;font-size:.9rem;line-height:1.5;word-break:break-word}
.pz-leer{margin-top:6px;background:none;border:0;padding:0;font:inherit;font-weight:700;font-size:.8rem;color:#6d2440;text-decoration:underline;cursor:pointer}
.pz-acc{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.pz-b{height:36px;padding:0 15px;border-radius:10px;border:0;font:inherit;font-weight:800;font-size:.84rem;cursor:pointer}
.pz-b.ent{background:linear-gradient(180deg,#e8335a,var(--esc2));color:#fff;box-shadow:0 3px 8px rgba(156,18,54,.4)}
.pz-b.res{background:transparent;color:#5a4a1e;border:1px solid rgba(90,74,30,.45)}
.pz-b.env{margin-top:6px;background:#12234a;color:#fff}
.pz-ok{font-size:.8rem;color:var(--ver2);font-weight:800}
.pz-resp{position:relative;padding-right:34px !important;}
.pz-chev2{position:absolute;top:2px;right:2px;width:34px;height:30px;border:0;background:none;font:inherit;font-weight:800;font-size:1.05rem;color:#4a6285;cursor:pointer}
.pz-resp{margin-top:12px;padding:8px 10px;border-radius:3px;background:#dfeefc;color:#13294d;font-size:.84rem;transform:rotate(-.6deg);box-shadow:0 3px 7px rgba(0,0,0,.25);word-break:break-word}
.pz-resp small{display:block;color:#4a6285;margin-bottom:2px}
.pz-caja{margin-top:10px}
.pz-caja textarea{width:100%;min-height:62px;border-radius:8px;border:1px solid rgba(90,74,30,.4);padding:8px;font:inherit;font-size:.9rem;background:#fffdf3;color:#35290f}
.pz-viej{justify-self:center;height:38px;padding:0 18px;border-radius:99px;border:1px dashed rgba(245,241,227,.6);background:transparent;color:#f5f1e3;font:inherit;font-weight:800;font-size:.84rem;cursor:pointer}
.pz-mes{justify-self:start;font-family:"Segoe Print","Bradley Hand",cursive;font-size:1rem;color:#ffe9a8;border-bottom:1px dashed rgba(245,241,227,.35);padding-bottom:3px;text-transform:capitalize}
.pz-filtros{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:-4px 0 18px}

      ['DIAG','1','2','3'].forEach(function(k){if(!ab&&es[k]==='abierto')ab=k;});
      var q={docente:p.docente,rotulo:p.rotulo,grupo:p.grupo,ciclo:p.ciclo,tot:al.length,altas:al.filter(function(x){return x.es_alta}).length,bajas:al.filter(function(x){return x.es_baja}).length,abierto:ab,perfil:p.perfil||''};
      guardaCache(q);pinta(q);traeAvisos();return;}
    if(r&&r.error==='llave no valida'){borraCache();try{localStorage.removeItem(LL);}catch(e){}estado('🔒','Esta llave ya no está activa','Pídele al director tu enlace nuevo.');return;}
    if(!c)estado('⚠️','No se pudo abrir',esc(String((r&&r.error)||'respuesta rara')),true);})
  .catch(function(){
    if(c)pinta(c,'📴 Sin señal: esta es la copia guardada en este aparato');
    else estado('📴','Sin señal','Necesito internet la primera vez. Revisa tu conexión.',true);});}
if(ADIOS){despedida();}
else if(!K){estado('🔑','Falta tu llave','Abre esta página desde el enlace que te mandó el director.');}
else busca();
})();
