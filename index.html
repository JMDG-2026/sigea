<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Telesecundaria 171 «24 de Febrero»</title>
<meta name="description" content="Sala del personal.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Telesecundaria 171 «24 de Febrero»">
<meta property="og:title" content="TELESECUNDARIA 171 &quot;24 DE FEBRERO&quot;">
<meta property="og:description" content="Sala del personal.">
<meta property="og:url" content="https://jmdg-2026.github.io/sigea/">
<meta property="og:image" content="https://jmdg-2026.github.io/sigea/corona.png">
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --noche:#091428; --navy:#12234a; --vino:#6d2440; --oro:#e2bb62; --oro2:#a9832f;
  --azur:#1f7ae0; --azur2:#0c4aa6; --nar:#ef8a1d; --nar2:#c4560a; --esc:#e0264d; --esc2:#9c1236;
  --ver:#1fa673; --ver2:#0d6b4a; --mor:#8656e0; --mor2:#4b2a9c; --tea:#17a0ad; --tea2:#0a6470;
  --texto:#f4f6fb; --suave:#b9c3da; --cristal:rgba(255,255,255,.08); --borde:rgba(255,255,255,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  min-height:100vh;color:var(--texto);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(900px 500px at 100% -10%, rgba(109,36,64,.75), transparent 60%),
    radial-gradient(700px 500px at -10% 30%, rgba(31,122,224,.25), transparent 60%),
    linear-gradient(180deg,#0a1630 0%,#091428 55%,#0b1a36 100%);
  background-attachment:fixed;
}
.estrellas{position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1.2px 1.2px at 20% 15%,#fff,transparent),radial-gradient(1px 1px at 70% 8%,#fff,transparent),
  radial-gradient(1.4px 1.4px at 85% 40%,#e2bb62,transparent),radial-gradient(1px 1px at 10% 60%,#fff,transparent),
  radial-gradient(1.2px 1.2px at 55% 75%,#e2bb62,transparent),radial-gradient(1px 1px at 92% 88%,#fff,transparent);}
.app{position:relative;max-width:460px;margin:0 auto;padding:0 16px 40px}
.cinta{margin:0 -16px;padding:7px 16px;text-align:center;font-size:.72rem;letter-spacing:.04em;color:#2a1a00;
  background:repeating-linear-gradient(45deg,#e2bb62,#e2bb62 14px,#d6a93f 14px,#d6a93f 28px);font-weight:800}
/* --- sello y corona --- */
.sello{text-align:center;padding:26px 0 8px}
.corona{position:relative;display:inline-block;font-size:3.1rem;line-height:1;filter:drop-shadow(0 4px 14px rgba(226,187,98,.55))}
.corona::after{content:"";position:absolute;inset:-6px;border-radius:50%;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);
  background-size:250% 100%;mix-blend-mode:overlay;animation:destello 4.5s ease-in-out infinite}
@keyframes destello{0%,55%{background-position:140% 0}100%{background-position:-60% 0}}
.chispa{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,236,170,.9);opacity:0;animation:chispa 4.5s ease-in-out infinite}
.chispa.a{top:2px;left:-6px;animation-delay:.4s}.chispa.b{top:-4px;right:2px;animation-delay:1.7s}.chispa.c{top:22px;right:-10px;animation-delay:2.9s}
@keyframes chispa{0%,100%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1)}30%{opacity:0;transform:scale(.4)}}
.sello h1{margin:10px 0 2px;font-size:1.28rem;letter-spacing:.01em}
.sello p{margin:0;color:var(--suave);font-size:.82rem}
/* --- bienvenida --- */
.cristal{background:var(--cristal);border:1px solid var(--borde);border-radius:22px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 14px 40px rgba(0,0,0,.28)}
.bien{padding:18px 18px 12px;margin-top:14px}
.bien .hola{font-size:1.28rem;font-weight:800;margin:0}
.bien .cuando{color:var(--suave);font-size:.84rem;margin:4px 0 12px}
.dias{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.dias .barra{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.dias .barra i{display:block;height:100%;width:28%;border-radius:99px;background:linear-gradient(90deg,var(--oro2),var(--oro))}
.dias span{font-size:.76rem;color:var(--suave);white-space:nowrap}
.rev h2{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--oro);margin:0 0 8px}
.ren{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:inherit;font:inherit;
  background:rgba(255,255,255,.06);border:1px solid var(--borde);border-radius:14px;padding:11px 12px;margin:0 0 8px;cursor:pointer;
  transition:transform .12s,background .12s}
.ren:active{transform:scale(.98);background:rgba(255,255,255,.12)}
.ren .pt{flex:0 0 12px;height:12px;border-radius:50%}
.ren b{display:block;font-size:.92rem}.ren small{color:var(--suave);font-size:.78rem}
.ren .fl{margin-left:auto;color:var(--suave);font-size:1.2rem}
/* --- cofres --- */
.cofres{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.cofre{position:relative;overflow:hidden;border:0;border-radius:24px;padding:16px 15px 15px;text-align:left;color:#fff;font:inherit;cursor:pointer;
  min-height:128px;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 14px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -18px 30px rgba(0,0,0,.18);
  transition:transform .14s,box-shadow .14s}
.cofre:active{transform:translateY(2px) scale(.985);box-shadow:0 6px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.cofre::before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.cofre::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent)}
.cofre .ico{position:relative;z-index:1;font-size:2.1rem;line-height:1;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3))}
.cofre h3{position:relative;z-index:1;margin:10px 0 6px;font-size:1.05rem;line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.cofre .et{position:relative;z-index:1;align-self:flex-start;font-size:.74rem;font-weight:800;padding:4px 10px;border-radius:99px;
  background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.28)}
.cofre.grande{grid-column:1 / -1;min-height:150px;flex-direction:row;align-items:center;gap:14px;justify-content:flex-start}
.cofre.grande .ico{font-size:3rem}.cofre.grande h3{font-size:1.3rem;margin:0 0 8px}
.cofre.grande>div{position:relative;z-index:1}
.c-azur{background:linear-gradient(145deg,#3b95ff,var(--azur) 45%,var(--azur2))}
.c-nar{background:linear-gradient(145deg,#ffab4a,var(--nar) 45%,var(--nar2))}
.c-esc{background:linear-gradient(145deg,#ff5577,var(--esc) 45%,var(--esc2))}
.c-ver{background:linear-gradient(145deg,#3fd197,var(--ver) 45%,var(--ver2))}
.c-mor{background:linear-gradient(145deg,#a98aff,var(--mor) 45%,var(--mor2))}
.c-tea{background:linear-gradient(145deg,#45d0dc,var(--tea) 45%,var(--tea2))}
.c-oro{background:linear-gradient(145deg,#f3d388,var(--oro) 45%,var(--oro2));color:#2b1c00}
.c-oro h3{text-shadow:none}.c-oro .et{background:rgba(255,255,255,.4);border-color:rgba(0,0,0,.2);color:#2b1c00}
.sec{margin:22px 4px 4px;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--suave)}
/* --- pie --- */
.pie{text-align:center;margin-top:30px;color:var(--suave);font-size:.8rem}
.pie svg{display:block;margin:0 auto 4px;animation:paso 6s ease-in-out infinite}
@keyframes paso{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.pie em{font-style:normal;color:var(--oro)}
/* --- hoja inferior --- */
.fondo{position:fixed;inset:0;background:rgba(3,8,20,.62);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.fondo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(100%,460px);max-height:92vh;overflow:auto;z-index:21;
  background:linear-gradient(180deg,#152a57,#0d1c3d);border:1px solid var(--borde);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px 26px;
  transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.hoja.on{transform:translate(-50%,0)}
.asa{width:46px;height:5px;border-radius:9px;background:rgba(255,255,255,.28);margin:0 auto 12px}
.hoja h2{margin:0 0 4px;font-size:1.2rem}.hoja .sub{color:var(--suave);font-size:.85rem;margin:0 0 14px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:inherit;font-weight:800;font-size:1rem;color:#2b1c00;cursor:pointer;
  background:linear-gradient(145deg,#f3d388,var(--oro));box-shadow:0 8px 20px rgba(226,187,98,.3)}
.btn[disabled]{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn.sec2{background:rgba(255,255,255,.1);color:var(--texto);box-shadow:none;margin-top:8px}

.nota{font-size:.78rem;color:var(--suave);margin:0 0 12px}
.estado{padding:26px 18px;margin-top:14px;text-align:center}
.estado .gr{font-size:2.6rem}.estado h2{margin:6px 0;font-size:1.15rem}.estado p{color:var(--suave);margin:0 0 14px;line-height:1.4;font-size:.9rem}
.estado .btn{max-width:260px;margin:0 auto}
.cofre.apagado{filter:saturate(.85)}
.cofre.apagado .et{background:rgba(0,0,0,.34)}
.cofre.link{text-decoration:none}
a.cofre{color:#fff}
.obra{text-align:center;padding:6px 0 4px}.obra .gr{font-size:2.4rem}
.obra svg{display:block;margin:6px auto 2px;animation:paso 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.corona::after,.chispa,.pie svg{animation:none}.chispa{opacity:0}.hoja{transition:none}}
</style>
</head>
<body>
<div class="estrellas"></div>
<div class="app">
  <header class="sello">
    <div class="corona" aria-hidden="true">&#128081;<span class="chispa a"></span><span class="chispa b"></span><span class="chispa c"></span></div>
    <h1 id="hEsc">Telesecundaria 171 «24 de Febrero»</h1>
    <p>Ocotepec, Chiapas · SIGEA</p>
  </header>
  <div id="sala"></div>
  <footer class="pie">
    <svg width="46" height="30" viewBox="0 0 46 30" aria-hidden="true">
      <ellipse cx="22" cy="17" rx="15" ry="10" fill="#1fa673"/>
      <path d="M12 15l5-5h10l5 5-5 5H17z" fill="none" stroke="#0d6b4a" stroke-width="1.6"/>
      <circle cx="40" cy="14" r="5" fill="#34c48b"/><circle cx="42" cy="13" r="1" fill="#06251b"/>
      <rect x="11" y="23" width="5" height="5" rx="2" fill="#34c48b"/><rect x="26" y="23" width="5" height="5" rx="2" fill="#34c48b"/>
    </svg>
    <em>Paso a paso</em>
  </footer>
</div>
<div class="fondo" id="fondo"></div>
<div class="hoja" id="hoja" role="dialog" aria-modal="true"><div class="asa"></div><div id="cont"></div></div>
<script>
/* SALA DE COFRES (Ladrillo 464): la puerta de la plataforma. Pide a la bodega el paquete con la llave que va despues del # y muestra los cofres. */
(function(){
var SIGEA_BODEGA='https://script.google.com/macros/s/AKfycbwSzbtVYd-DdopI8tC95Ao1gWXiWzQf4_wZHJQolq5GBTyuGtwLvJrkMj1JkV01clKVUQ/exec';
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var K='',B=SIGEA_BODEGA;
try{var h=(location.hash||'').replace(/^#/,'');
  if(h.indexOf('=')<0)K=decodeURIComponent(h);
  else h.split('&').forEach(function(x){var i=x.indexOf('='),n=x.slice(0,i),v=decodeURIComponent(x.slice(i+1));if(n==='k')K=v;if(n==='b'&&!SIGEA_BODEGA)B=v;});
}catch(e){}
function hh(s){var a=0x811c9dc5,b=0x1b873593;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=Math.imul(a^c,16777619);b=Math.imul(b^c,2246822519);}return (a>>>0).toString(36)+(b>>>0).toString(36);}
var CK='sigea_sala_'+hh(K);
function leeCache(){try{return JSON.parse(localStorage.getItem(CK)).q||null;}catch(e){return null;}}
function guardaCache(q){try{localStorage.setItem(CK,JSON.stringify({q:q}));}catch(e){}}
function borraCache(){try{localStorage.removeItem(CK);}catch(e){}}
var hoja=$('hoja'),fondo=$('fondo'),cont=$('cont'),sala=$('sala');
function abrir(h){cont.innerHTML=h;hoja.classList.add('on');fondo.classList.add('on')}
function cerrar(){hoja.classList.remove('on');fondo.classList.remove('on')}
fondo.onclick=cerrar;window.cerrarSala=cerrar;
function estado(ico,tit,msg,reint){
  sala.innerHTML='<section class="cristal estado"><div class="gr">'+ico+'</div><h2>'+tit+'</h2><p>'+msg+'</p>'+(reint?'<button class="btn" id="reint">Intentar de nuevo</button>':'')+'</section>';
  if(reint)$('reint').onclick=busca;}
var TIT=/^(prof(a|esora|esor)?|mtr[ao]|lic|ing|dr|dra|c)\.?$/i;
function quien(q){
  var doc=String(q.docente||'').trim(),t=doc.split(/\s+/),tit='',nom=t.slice();
  if(t.length>1&&(TIT.test(t[0])||/\.$/.test(t[0]))){tit=t[0];nom=t.slice(1);}
  var pri=(nom[0]||'');pri=pri.charAt(0).toUpperCase()+pri.slice(1).toLowerCase();
  var rot=String(q.rotulo||'').toUpperCase(),gen=rot.indexOf('LA ')===0?'maestra':(rot.indexOf('EL ')===0&&rot.indexOf('/')<0?'maestro':'maestro(a)');
  return {saludo:gen+(pri?' '+pri:''),completo:doc};}
function saludoHora(){var hr=new Date().getHours();return hr<12?'Buenos días':hr<19?'Buenas tardes':'Buenas noches';}
function fechaHoy(){var f=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});return f.charAt(0).toUpperCase()+f.slice(1);}
var OBRA={
 permisos:['🗓️','Mis permisos','Aquí pedirás tus permisos picando los días en un calendario, y verás cuántos días llevas.'],
 avisos:['💬','Avisos','Aquí te llegarán los avisos del director.'],
 entregas:['📤','Entregas','Aquí subirás tus documentos en PDF y verás qué te falta entregar.'],
 calendario:['📅','Calendario','Aquí verás las fechas importantes del ciclo.'],
 biblioteca:['📚','Biblioteca SIGEP','Aquí abrirás la carpeta con los materiales del personal.'],
 tutoriales:['🎬','Tutoriales','Aquí aprenderás paso a paso a usar la plataforma.']};
function enObra(id){var o=OBRA[id];if(!o)return;
  abrir('<div class="obra"><div class="gr">🚧</div><h2>'+o[0]+' '+o[1]+'</h2><p class="sub">En construcción</p><p class="nota">'+o[2]+'</p>'+
  '<svg width="46" height="30" viewBox="0 0 46 30" aria-hidden="true"><ellipse cx="22" cy="17" rx="15" ry="10" fill="#1fa673"/><path d="M12 15l5-5h10l5 5-5 5H17z" fill="none" stroke="#0d6b4a" stroke-width="1.6"/><circle cx="40" cy="14" r="5" fill="#34c48b"/><circle cx="42" cy="13" r="1" fill="#06251b"/><rect x="11" y="23" width="5" height="5" rx="2" fill="#34c48b"/><rect x="26" y="23" width="5" height="5" rx="2" fill="#34c48b"/></svg>'+
  '<p class="nota"><em style="font-style:normal;color:var(--oro)">Paso a paso</em>: pronto se abre.</p></div><button class="btn sec2" onclick="cerrarSala()">Volver a la sala</button>');}
function pinta(q,aviso){
  var w=quien(q),g=q.grupo||{},gtxt=(g.grado?g.grado+'° '+(g.letra||''):'');
  var hr='#k='+encodeURIComponent(K)+((B&&!SIGEA_BODEGA)?'&b='+encodeURIComponent(B):'');
  sala.innerHTML=
   '<section class="cristal bien"><p class="hola">'+esc(saludoHora()+', '+w.saludo)+'</p>'+
   '<p class="cuando">'+esc(fechaHoy()+(gtxt?' · '+gtxt:''))+'</p>'+
   (w.completo?'<p class="nota" style="margin:0">'+esc(w.completo)+'</p>':'')+
   '<p class="nota" style="margin:8px 0 2px">Tu sala está creciendo. Por ahora tus calificaciones ya están listas.</p></section>'+
   '<div class="cofres"><a class="cofre grande c-azur link" id="cCal" href="calificaciones.html'+hr+'"><span class="ico">📘</span><div><h3>Mis calificaciones</h3><span class="et">'+esc(gtxt?'Grupo '+gtxt:'Abrir')+'</span></div></a>'+
   '<button class="cofre c-nar apagado" data-o="permisos"><span class="ico">🗓️</span><h3>Mis permisos</h3><span class="et">En construcción</span></button>'+
   '<button class="cofre c-esc apagado" data-o="avisos"><span class="ico">💬</span><h3>Avisos</h3><span class="et">En construcción</span></button>'+
   '<button class="cofre c-ver apagado" data-o="entregas"><span class="ico">📤</span><h3>Entregas</h3><span class="et">En construcción</span></button>'+
   '<button class="cofre c-mor apagado" data-o="calendario"><span class="ico">📅</span><h3>Calendario</h3><span class="et">En construcción</span></button></div>'+
   '<div class="sec">Para todo el personal</div><div class="cofres">'+
   '<button class="cofre c-tea apagado" data-o="biblioteca"><span class="ico">📚</span><h3>Biblioteca SIGEP</h3><span class="et">En construcción</span></button>'+
   '<button class="cofre c-oro apagado" data-o="tutoriales"><span class="ico">🎬</span><h3>Tutoriales</h3><span class="et">En construcción</span></button></div>';
  Array.prototype.forEach.call(sala.querySelectorAll('[data-o]'),function(b){b.onclick=function(){enObra(b.getAttribute('data-o'))}});
  if(aviso){var n=document.createElement('p');n.className='nota';n.style.textAlign='center';n.textContent=aviso;sala.appendChild(n);}}
function busca(){
  var c=leeCache();
  if(c)pinta(c);else estado('⏳','Abriendo tu sala…','Un momento.');
  if(!B){if(!c)estado('⚠️','Falta la dirección de la bodega','Esta página no está preparada. Avísale al director.');return;}
  fetch(B,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({op:'traer',clave:K})})
  .then(function(r){return r.json();})
  .then(function(r){
    if(r&&r.ok===true){
      if(!r.paquete){if(!c)estado('📭','Tu grupo todavía no está listo','El director aún no lo ha publicado. Intenta más tarde.',true);return;}
      var p=r.paquete,q={docente:p.docente,rotulo:p.rotulo,grupo:p.grupo,escuela:p.escuela?{nombre:p.escuela.nombre}:null};
      guardaCache(q);pinta(q);return;}
    if(r&&r.error==='llave no valida'){borraCache();estado('🔒','Esta llave ya no está activa','Pídele al director tu enlace nuevo.');return;}
    if(!c)estado('⚠️','No se pudo abrir',esc(String((r&&r.error)||'respuesta rara')),true);})
  .catch(function(){
    if(c)pinta(c,'📴 Sin señal: esta es la copia guardada en este aparato');
    else estado('📴','Sin señal','Necesito internet la primera vez. Revisa tu conexión.',true);});}
if(!K){estado('🔑','Falta tu llave','Abre esta página desde el enlace que te mandó el director.');}
else busca();
})();
</script>
</body>
</html>
